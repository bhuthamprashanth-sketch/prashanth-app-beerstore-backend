name: Backend CI

on:
  pull_request:
    branches: [ develop, release, main ]
  push:
    branches: [ develop, release, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --check server.js
      - run: node --check routes/auth.js
      - run: node --check routes/beers.js
      - run: node --check routes/orders.js
      - run: node --check routes/admin.js
      - run: node --check middleware/auth.js
      - run: node --check data/database.js
